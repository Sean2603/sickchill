# Fork-only image build: publishes ghcr.io/<owner>/sickchill:<branch> using only GITHUB_TOKEN
# (no Docker Hub secrets needed). Point Portainer at that tag and recreate with "re-pull image".
# Manual only: Actions -> GHCR Image -> Run workflow, then pick the branch to build.

name: GHCR Image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Target platforms (comma separated)
        required: false
        default: linux/arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  Build:
    # Upstream publishes its own images; only run this in forks.
    if: github.repository_owner != 'SickChill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Docker meta
        id: docker
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0+
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix={{branch}}-

      - name: Set up QEMU
        if: contains(inputs.platforms || 'linux/arm64', 'arm')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            experimental = true
            insecure-entitlements = ["security.insecure"]

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/arm64' }}
          push: true
          tags: ${{ steps.docker.outputs.tags }}
          labels: ${{ steps.docker.outputs.labels }}
          target: sickchill-final
          cache-from: type=gha,scope=ghcr-sickchill
          cache-to: type=gha,mode=max,scope=ghcr-sickchill
          # SOURCE=1 builds from this checkout; without it the Dockerfile installs sickchill from PyPI.
          build-args: |
            SOURCE=1
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            PIP_EXTRA_INDEX_URL=https://www.piwheels.org/simple
          allow: |
            security.insecure
